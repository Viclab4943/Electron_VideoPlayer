name: Build Video Player

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm install

      - name: Build for ${{ matrix.platform }}
        run: npm run build:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Mac artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Windows
          path: |
            dist/*.exe
          retention-days: 30

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Video Player ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist-all/**/*
          body: |
            ## Video Player ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Mac | `.dmg` installer |
            | Windows | `.exe` installer |
            | Linux | `.AppImage` or `.deb` |

            ### Setup
            1. Install the app
            2. On first launch, the videos folder is created automatically at:
               - Mac/Linux: ~/Documents/VideoPlayer/videos/
               - Windows: Documents\VideoPlayer\videos\
            3. Add your videos there and launch!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
